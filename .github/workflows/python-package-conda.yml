name: Backend CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Validate required secrets
        run: |
          test -n "${{ secrets.LLM_PROVIDER }}"
          test -n "${{ secrets.GROQ_API_KEY }}"
          test -n "${{ secrets.GROQ_API_BASE }}"
          test -n "${{ secrets.GROQ_MODEL }}"
          test -n "${{ secrets.TIMEOUT }}"
          test -n "${{ secrets.TEMPERATURE }}"
          test -n "${{ secrets.MAX_TOKENS }}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r ai/requirements.txt
          pip install pytest flake8 requests

      - name: Verify critical files exist
        run: |
          test -f backend/app/main.py
          test -f backend/app/api/routes/chat.py
          test -f backend/app/api/routes/planner.py
          test -f ai/chat_service.py
          test -f ai/planner_llm/llm_client.py

      - name: Create backend .env
        run: |
          cat <<EOF > backend/.env
          LLM_PROVIDER=${{ secrets.LLM_PROVIDER }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          GROQ_API_BASE=${{ secrets.GROQ_API_BASE }}
          GROQ_MODEL=${{ secrets.GROQ_MODEL }}
          TIMEOUT=${{ secrets.TIMEOUT }}
          TEMPERATURE=${{ secrets.TEMPERATURE }}
          MAX_TOKENS=${{ secrets.MAX_TOKENS }}
          EOF

      - name: Create AI .env
        run: |
          cat <<EOF > ai/.env
          LLM_PROVIDER=${{ secrets.LLM_PROVIDER }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          GROQ_API_BASE=${{ secrets.GROQ_API_BASE }}
          GROQ_MODEL=${{ secrets.GROQ_MODEL }}
          TIMEOUT=${{ secrets.TIMEOUT }}
          TEMPERATURE=${{ secrets.TEMPERATURE }}
          MAX_TOKENS=${{ secrets.MAX_TOKENS }}
          EOF

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Start backend server
        run: |
          cd backend
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 > backend.log 2>&1 &
          echo $! > backend.pid
          sleep 10

      - name: Wait for backend to be ready
        run: |
          for i in {1..15}; do
            if curl --silent --fail http://127.0.0.1:8001/health; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend..."
            sleep 2
          done
          echo "Backend failed to start in time"
          exit 1

      - name: Check backend health endpoints
        run: |
          curl --fail http://127.0.0.1:8001/health
          curl --fail http://127.0.0.1:8001/api/health
          curl --fail http://127.0.0.1:8001/api/chat/health
          curl --fail http://127.0.0.1:8001/api/plan/health

      - name: Run integration tests
        env:
          REQUIRE_FRONTEND: "false"
        run: |
          python test_integration.py
          python test_llama_integration.py

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend/backend.log

      - name: Show backend logs if failed
        if: failure()
        run: |
          cat backend/backend.log

      - name: Stop backend server
        if: always()
        run: |
          if [ -f backend/backend.pid ]; then
            kill $(cat backend/backend.pid) || true
          fi