name: UpGrade Full CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Backend (FastAPI)
  # ─────────────────────────────────────────
  backend-check:
    name: "Backend CI (FastAPI)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Validate secrets
        run: |
          test -n "${{ secrets.LLM_PROVIDER }}"
          test -n "${{ secrets.GROQ_API_KEY }}"
          test -n "${{ secrets.GROQ_API_BASE }}"
          test -n "${{ secrets.GROQ_MODEL }}"
          test -n "${{ secrets.TIMEOUT }}"
          test -n "${{ secrets.TEMPERATURE }}"
          test -n "${{ secrets.MAX_TOKENS }}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest flake8 requests

      - name: Verify backend files exist
        run: |
          test -f backend/app/main.py
          test -f backend/app/api/routes/chat.py
          test -f backend/app/api/routes/planner.py
          test -f backend/app/api/routes/auth.py
          test -f backend/app/api/routes/tasks.py
          test -f backend/app/core/config.py
          test -f backend/app/core/database.py

      - name: Create backend .env
        run: |
          cat <<EOF > backend/.env
          LLM_PROVIDER=${{ secrets.LLM_PROVIDER }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          GROQ_API_BASE=${{ secrets.GROQ_API_BASE }}
          GROQ_MODEL=${{ secrets.GROQ_MODEL }}
          TIMEOUT=${{ secrets.TIMEOUT }}
          TEMPERATURE=${{ secrets.TEMPERATURE }}
          MAX_TOKENS=${{ secrets.MAX_TOKENS }}
          EOF

      - name: Lint with flake8
        run: |
          flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 backend/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Start backend server
        run: |
          cd backend
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 > backend.log 2>&1 &
          echo $! > backend.pid
          sleep 10

      - name: Wait for backend
        run: |
          for i in {1..15}; do
            if curl --silent --fail http://127.0.0.1:8001/health; then
              echo "Backend ready"; exit 0
            fi
            echo "Waiting... ($i/15)"; sleep 2
          done
          cat backend/backend.log; exit 1

      - name: Health checks
        run: |
          curl --fail http://127.0.0.1:8001/health
          curl --fail http://127.0.0.1:8001/api/health
          curl --fail http://127.0.0.1:8001/api/chat/health
          curl --fail http://127.0.0.1:8001/api/plan/health

      - name: Run backend tests
        run: python -m pytest backend/tests/ -v --tb=short

      - name: Stop backend
        if: always()
        run: kill $(cat backend/backend.pid) || true

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend/backend.log

  # ─────────────────────────────────────────
  # JOB 2: AI Service
  # ─────────────────────────────────────────
  ai-check:
    name: "AI Service CI"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install AI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai/requirements.txt
          pip install flake8

      - name: Verify AI files exist
        run: |
          test -f ai/chat_service.py
          test -f ai/planner_llm/llm_client.py

      - name: Create AI .env
        run: |
          cat <<EOF > ai/.env
          LLM_PROVIDER=${{ secrets.LLM_PROVIDER }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          GROQ_API_BASE=${{ secrets.GROQ_API_BASE }}
          GROQ_MODEL=${{ secrets.GROQ_MODEL }}
          TIMEOUT=${{ secrets.TIMEOUT }}
          TEMPERATURE=${{ secrets.TEMPERATURE }}
          MAX_TOKENS=${{ secrets.MAX_TOKENS }}
          EOF

      - name: Lint AI with flake8
        run: |
          flake8 ai/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 ai/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run AI integration tests
        env:
          REQUIRE_FRONTEND: "false"
        run: python test_llama_integration.py

  # ─────────────────────────────────────────
  # JOB 3: Frontend (Flutter)
  # ─────────────────────────────────────────
  frontend-check:
    name: "Frontend CI (Flutter)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: "stable"
          cache: true

      - name: Verify frontend files exist
        run: |
          test -f frontend/pubspec.yaml
          test -f frontend/lib/main.dart
          test -f frontend/lib/app.dart
          test -f frontend/lib/providers/classroom_provider.dart
          test -f frontend/lib/services/api_service.dart

      - name: Install Flutter packages
        working-directory: frontend
        run: flutter pub get

      - name: Check for conflicting packages
        working-directory: frontend
        run: flutter pub outdated || true

      - name: Analyze Dart code
        working-directory: frontend
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        working-directory: frontend
        run: flutter test --reporter=expanded

      - name: Check Dart formatting
        working-directory: frontend
        run: dart format --output=none --set-exit-if-changed lib/

  # ─────────────────────────────────────────
  # JOB 4: Summary
  # ─────────────────────────────────────────
  all-checks-passed:
    name: "All Checks Passed "
    runs-on: ubuntu-latest
    needs: [backend-check, ai-check, frontend-check]
    if: always()
    steps:
      - name: Report status
        run: |
          echo "Backend:  ${{ needs.backend-check.result }}"
          echo "AI:       ${{ needs.ai-check.result }}"
          echo "Frontend: ${{ needs.frontend-check.result }}"
          if [[ "${{ needs.backend-check.result }}"  != "success" || \
                "${{ needs.ai-check.result }}"        != "success" || \
                "${{ needs.frontend-check.result }}"  != "success" ]]; then
            echo " One or more checks FAILED"
            exit 1
          fi
          echo " All checks passed!"